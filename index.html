<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b2a4a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="アクテリ" />
    <meta name="description" content="AQUA TERRITORY（アクテリ）水圏生物対戦カードゲーム" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>AQUA TERRITORY</title>
    <style>
      #rotate-hint { display: none; }
      @media (orientation: portrait) and (max-width: 900px) {
        #rotate-hint {
          display: flex; position: fixed; inset: 0; z-index: 99999;
          flex-direction: column; align-items: center; justify-content: center;
          background: #0b2a4a; color: #fff; text-align: center; padding: 24px;
          font: 700 22px/1.6 system-ui, sans-serif;
        }
        #rotate-hint .icon { font-size: 64px; transform: rotate(-90deg); margin-bottom: 16px; }
        #root { visibility: hidden; }
      }
    </style>
  </head>
  <body>
    <div id="rotate-hint"><div class="icon">📱</div><div>スマホを横向きにしてください</div><div style="font-size:15px;opacity:.8;margin-top:8px">横にすると、ゲーム画面が表示されます</div></div>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
